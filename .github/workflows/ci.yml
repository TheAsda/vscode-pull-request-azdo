# CI for the Azure DevOps fork of vscode-pull-request-github.
#
# - Every push to main and every pull request: lint, compile, node tests,
#   then package a VSIX artifact.
# - Tag pushes (v*): additionally attach the VSIX to a GitHub Release so
#   colleagues can install it directly.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Node tests
        run: |
          npm run compile:test
          npm run test:scripts
          npm run check:commands

      - name: Bundle (production)
        run: npm run bundle

      - name: Package VSIX
        run: npx @vscode/vsce@3 package --no-dependencies --out "vscode-pull-request-azdo-${{ github.sha }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
          generate_release_notes: true
